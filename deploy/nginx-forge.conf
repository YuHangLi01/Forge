# /etc/nginx/sites-available/forge
#
# Two deployment modes — choose ONE:
#
#   1. HTTP only (demo / IP-only deploy): use the active server block below.
#   2. HTTPS (production with domain): comment out the HTTP block, uncomment
#      the HTTPS template at the bottom, then:
#        sudo certbot --nginx -d YOUR_DOMAIN
#        sudo nginx -t && sudo systemctl reload nginx
#
# After editing:
#   sudo ln -sf /etc/nginx/sites-available/forge /etc/nginx/sites-enabled/forge
#   sudo nginx -t && sudo systemctl reload nginx

# ── MODE 1: HTTP only (active) ───────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;
    proxy_read_timeout 90s;

    # Feishu event subscription webhook
    location /api/v1/webhook/feishu {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feishu OAuth 2.0 callback — user authorizes calendar; token stored per-user
    location /api/v1/oauth/feishu {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Volcengine ASR v3 fetches audio files from this endpoint
    location /api/v1/asr_audio {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8000;
    }

    location /readyz {
        proxy_pass http://127.0.0.1:8000;
    }

    # Block everything else by default
    location / {
        return 404;
    }
}

# ── MODE 2: HTTPS template (commented out) ──────────────────────────────────
